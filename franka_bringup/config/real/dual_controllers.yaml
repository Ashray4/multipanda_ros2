controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    franka_left_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
    franka_right_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
    franka_left_robot_model_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotModelBroadcaster
    franka_right_robot_model_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotModelBroadcaster
    dual_joint_impedance_example_controller:
      type: franka_example_controllers/MultiJointImpedanceExampleController
    dual_joint_velocity_example_controller:
      type: franka_example_controllers/DualJointVelocityExampleController
    franka_left_panda_pd_controller:
      type: pd_controller_franka_panda_with_compensation/PDFrankaPandaControllerCompensation
    franka_right_panda_pd_controller:
      type: pd_controller_franka_panda_with_compensation/PDFrankaPandaControllerCompensation
    dual_mpc_controller:
      type: dual_mpc_closed_loop_control/DualMPCPLannerActionController
    
franka_left_robot_state_broadcaster:
  ros__parameters:
    arm_id: left
    frequency: 30

franka_right_robot_state_broadcaster:
  ros__parameters:
    arm_id: right
    frequency: 30

franka_left_robot_model_broadcaster:
  ros__parameters:
    arm_id: left
    frequency: 30

franka_right_robot_model_broadcaster:
  ros__parameters:
    arm_id: right
    frequency: 30
    
dual_joint_impedance_example_controller:
  ros__parameters:
    arm_count: 2
    arm_1:
      arm_id: left
      k_gains:
        - 24.0
        - 24.0
        - 24.0
        - 24.0
        - 10.0
        - 6.0
        - 2.0
      d_gains:
        - 2.0
        - 2.0
        - 2.0
        - 1.0
        - 1.0
        - 1.0
        - 0.5
    arm_2:
      arm_id: right
      k_gains:
        - 24.0
        - 24.0
        - 24.0
        - 24.0
        - 10.0
        - 6.0
        - 2.0
      d_gains:
        - 2.0
        - 2.0
        - 2.0
        - 1.0
        - 1.0
        - 1.0
        - 0.5
    
dual_joint_velocity_example_controller:
  ros__parameters:
    arm_1:
      arm_id: left
    arm_2:
      arm_id: right

franka_left_panda_pd_controller:
   ros__parameters:
    arm_id: "left"
    p_gains:
      - 24.0
      - 24.0
      - 24.0
      - 24.0
      - 24.0
      - 24.0
      - 24.0
    d_gains:
      - 10.0
      - 10.0
      - 10.0
      - 10.0
      - 10.0
      - 10.0
      - 10.0


franka_right_panda_pd_controller:
   ros__parameters:
    arm_id: "right"
    p_gains:
      - 24.0
      - 24.0
      - 24.0
      - 24.0
      - 24.0
      - 24.0
      - 24.0
    d_gains:
      - 10.0
      - 10.0
      - 10.0
      - 10.0
      - 10.0
      - 10.0
      - 10.0

dual_mpc_controller:
   ros__parameters:
    update_rate: 100 #Hz
    open_loop_mode: true
    mixed: false
    prediction_horizon: 3
    arm_id_l: "left"
    arm_id_r: "right"